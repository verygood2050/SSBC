<section id="department" class="section">
            <div class="card">
                <div class="dept-header">
                    <h3 class="card-title" style="margin-bottom:0;">👥 부서 게시판</h3>
                    <button class="dept-manage-btn" onclick="openDeptManageModal()">⚙️ 부서 관리</button>
                </div>
                <div class="dept-tabs" id="deptTabs"></div>
                <button class="admin-toggle-btn" onclick="togglePanel('deptAdminPanel', this)">➕ 게시글 등록하기</button>
                <div class="admin-panel" id="deptAdminPanel">
                    <h4 class="admin-title">⚙️ 게시글 등록</h4>
                    <div class="form-group">
                        <label class="form-label">부서</label>
                        <select class="form-select" id="deptPostDept"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-input" id="deptPostTitle" placeholder="제목">
                    </div>
                    <div class="form-group">
                        <label class="form-label">내용</label>
                        <textarea class="form-textarea" id="deptPostContent" placeholder="내용"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="deptPostLocked" onchange="togglePasswordField()">
                            <span>🔒 비밀글로 설정</span>
                        </label>
                        <div class="password-field" id="passwordField">
                            <label>비밀번호 설정</label>
                            <input type="text" id="deptPostPassword" placeholder="비밀번호 입력">
                        </div>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="addDeptPost()">게시글 등록</button>
                </div>
                <div id="deptContents"></div>
            </div>
        </section>

        <section id="stats" class="section">
            <div class="card">
                <h3 class="card-title">📊 사용 통계</h3>
                
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-value" id="totalVisits">0</div>
                        <div class="stat-label">총 방문 횟수</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📅</div>
                        <div class="stat-value" id="todayVisits">0</div>
                        <div class="stat-label">오늘 방문</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏰</div>
                        <div class="stat-value" id="lastVisitTime">-</div>
                        <div class="stat-label">마지막 접속</div>
                    </div>
                </div>

                <h4 class="card-title mt-16">📈 일별 방문 추이 (최근 7일)</h4>
                <div class="daily-chart" id="dailyChart"></div>

                <h4 class="card-title mt-16">🎯 섹션별 조회수</h4>
                <div class="section-stats" id="sectionStats"></div>
            </div>
        </section>
